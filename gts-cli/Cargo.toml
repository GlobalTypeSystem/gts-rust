[package]
name = "gts-cli"
version = "0.17.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Global Type System (GTS) CLI and HTTP server"
keywords = ["gts", "cli", "http", "server"]
categories.workspace = true
readme.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "gts"
path = "src/main.rs"

[[bin]]
name = "cargo-gts"
path = "src/cargo_main.rs"

[dependencies]
gts.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
regex.workspace = true
# Source inventory for compiled schema export; locations give error line numbers.
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "2.0", features = ["full", "visit"] }
# `harness = false` targets, which `cargo metadata` does not report.
toml = "1.1"
uuid.workspace = true
walkdir.workspace = true
shellexpand = "3.1"

[dev-dependencies]
tempfile = "3.8"
tower = "0.5"
